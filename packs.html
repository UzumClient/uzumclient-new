<!doctype html>
<html lang="uz" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/icon.png" />
<title>ResursPacklar — UZUM CLIENT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0e17;color:#e8ecf5;font-family:Inter,system-ui,sans-serif;min-height:100vh}
a{color:inherit}
.top{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#0b0e17ee;border-bottom:1px solid #ffffff14;backdrop-filter:blur(8px)}
.top{position:sticky;top:0;z-index:5}
.back{text-decoration:none;border:1px solid #ffffff2a;border-radius:10px;padding:8px 14px;font-size:14px}
h1{font-size:20px}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 80px}
.msg{text-align:center;color:#9aa3b8;margin:60px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:#131828;border:1px solid #ffffff12;border-radius:16px;overflow:hidden}
.card h3{padding:14px 16px 4px;font-size:17px}
.viewer{position:relative;background:#000}
.viewer img.main{width:100%;height:200px;object-fit:cover;display:block;cursor:zoom-in}
.nav{position:absolute;top:50%;transform:translateY(-50%);background:#000a;border:none;color:#fff;font-size:22px;width:36px;height:36px;border-radius:50%;cursor:pointer}
.nav.l{left:8px}.nav.r{right:8px}
.cnt{position:absolute;bottom:8px;right:10px;background:#000a;font-size:12px;padding:2px 8px;border-radius:8px}
.dl{display:block;text-align:center;margin:12px 16px 16px;background:#22c55e;color:#04120a;font-weight:700;text-decoration:none;padding:11px;border-radius:10px}
.adm{margin-top:36px;background:#131828;border:1px dashed #ffffff2c;border-radius:16px;padding:20px}
.adm h2{font-size:17px;margin-bottom:12px}
.adm input[type=text]{width:100%;background:#0b0e17;border:1px solid #ffffff22;color:#fff;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.adm label{font-size:13px;color:#9aa3b8;display:block;margin:8px 0 4px}
.adm input[type=file]{margin-bottom:6px;color:#9aa3b8}
.prev{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.prev img{width:80px;height:60px;object-fit:cover;border-radius:8px}
.pub{background:#3b82f6;border:none;color:#fff;font-weight:700;padding:11px 18px;border-radius:10px;cursor:pointer;margin-top:8px}
.st{font-size:13px;color:#9aa3b8;margin-top:8px}
.del{background:#ef4444;border:none;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer;margin:0 16px 16px;font-size:13px}
.lb{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:50}
.lb.open{display:flex}
.lb img{max-width:92vw;max-height:88vh;border-radius:10px}
.lb .x{position:absolute;top:14px;right:18px;background:#ffffff22;border:none;color:#fff;font-size:20px;width:40px;height:40px;border-radius:50%;cursor:pointer}
.lb .nav{width:48px;height:48px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="top">
<a class="back" href="/">← Orqaga</a>
<h1>ResursPacklar</h1>
</div>
<div class="wrap">
<div id="auth" class="msg">Tekshirilmoqda...</div>
<div id="grid" class="grid"></div>
<div id="adm" class="adm hidden">
<h2>Yangi ResursPack qo'shish</h2>
<input id="pname" type="text" maxlength="60" placeholder="Pack nomi (masalan: Purple 16x)" />
<label>Rasmlar (1-3 ta)</label>
<input id="pimgs" type="file" accept="image/*" multiple />
<div id="pprev" class="prev"></div>
<label>Pack fayli (.zip)</label>
<input id="pfile" type="file" accept=".zip" />
<div><button id="ppub" class="pub">Joylash</button></div>
<div id="pst" class="st"></div>
</div>
</div>
<div id="lb" class="lb">
<button class="x" id="lbx">✕</button>
<button class="nav l" id="lbl">‹</button>
<img id="lbi" src="" alt="" />
<button class="nav r" id="lbr">›</button>
</div>
<script>
var API = location.origin + '/api';
function cookie(n){var m=document.cookie.match(new RegExp('(^| )'+n+'=([^;]+)'));return m?decodeURIComponent(m[2]):'';}
var TOKEN = cookie('ajax-cookie');
var ME = null, PACKS = [], LBI = 0, LBIMGS = [];

function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}

async function boot(){
  var box = document.getElementById('auth');
  if(!TOKEN){ box.innerHTML = 'ResursPacklarni ko\'rish uchun <a href="/sign-in">kiring</a>.'; return; }
  try{
    var r = await fetch(API + '/users/auth/session?token=' + encodeURIComponent(TOKEN), {method:'POST'});
    if(!r.ok) throw 0;
    ME = await r.json();
  }catch(e){ box.innerHTML = 'Sessiya tugagan. <a href="/sign-in">Qayta kiring</a>.'; return; }
  box.style.display = 'none';
  if(ME.role === 'ADMIN') document.getElementById('adm').classList.remove('hidden');
  load();
}

async function load(){
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  try{
    var r = await fetch(API + '/packs/list?token=' + encodeURIComponent(TOKEN));
    if(!r.ok) throw 0;
    PACKS = await r.json();
  }catch(e){ grid.innerHTML = '<div class="msg">Yuklanmadi.</div>'; return; }
  if(!PACKS.length){ grid.innerHTML = '<div class="msg">Hozircha packlar yo\'q.</div>'; return; }
  PACKS.forEach(function(p, pi){
    var card = el('div','card');
    card.appendChild(el('h3','',p.name));
    var v = el('div','viewer');
    var img = el('img','main'); img.src = p.images[0]; img.alt = p.name;
    img.onclick = function(){ openLb(p.images, 0); };
    v.appendChild(img);
    if(p.images.length > 1){
      var idx = 0;
      var bl = el('button','nav l','‹'), br = el('button','nav r','›');
      var cnt = el('div','cnt','1 / ' + p.images.length);
      bl.onclick = function(ev){ ev.stopPropagation(); idx = (idx+p.images.length-1)%p.images.length; img.src = p.images[idx]; cnt.textContent = (idx+1)+' / '+p.images.length; };
      br.onclick = function(ev){ ev.stopPropagation(); idx = (idx+1)%p.images.length; img.src = p.images[idx]; cnt.textContent = (idx+1)+' / '+p.images.length; };
      v.appendChild(bl); v.appendChild(br); v.appendChild(cnt);
      img.onclick = function(){ openLb(p.images, idx); };
    }
    card.appendChild(v);
    var a = el('a','dl','Yuklab olish');
    a.href = p.file;
    card.appendChild(a);
    if(ME && ME.role === 'ADMIN'){
      var del = el('button','','O\'chirish');
      del.className = 'del';
      del.onclick = async function(){
        if(!confirm('O\'chirilsinmi: ' + p.name + '?')) return;
        await fetch(API + '/packs/remove?token=' + encodeURIComponent(TOKEN) + '&id=' + p.id, {method:'POST'});
        load();
      };
      card.appendChild(del);
    }
    grid.appendChild(card);
  });
}

// lightbox
var lb = document.getElementById('lb'), lbi = document.getElementById('lbi');
function openLb(imgs, i){ LBIMGS = imgs; LBI = i; lbi.src = imgs[i]; lb.classList.add('open'); }
function lbGo(d){ if(!LBIMGS.length) return; LBI = (LBI+d+LBIMGS.length)%LBIMGS.length; lbi.src = LBIMGS[LBI]; }
document.getElementById('lbx').onclick = function(){ lb.classList.remove('open'); };
document.getElementById('lbl').onclick = function(e){ e.stopPropagation(); lbGo(-1); };
document.getElementById('lbr').onclick = function(e){ e.stopPropagation(); lbGo(1); };
lb.onclick = function(e){ if(e.target === lb) lb.classList.remove('open'); };
document.addEventListener('keydown', function(e){
  if(!lb.classList.contains('open')) return;
  if(e.key === 'Escape') lb.classList.remove('open');
  if(e.key === 'ArrowLeft') lbGo(-1);
  if(e.key === 'ArrowRight') lbGo(1);
});
var tx0 = 0;
lb.addEventListener('touchstart', function(e){ tx0 = e.changedTouches[0].clientX; }, {passive:true});
lb.addEventListener('touchend', function(e){
  var dx = e.changedTouches[0].clientX - tx0;
  if(Math.abs(dx) > 40) lbGo(dx < 0 ? 1 : -1);
}, {passive:true});

// admin upload
document.getElementById('pimgs').addEventListener('change', function(){
  var box = document.getElementById('pprev'); box.innerHTML = '';
  Array.prototype.slice.call(this.files, 0, 3).forEach(function(f){
    var im = document.createElement('img'); im.src = URL.createObjectURL(f); box.appendChild(im);
  });
});
document.getElementById('ppub').onclick = async function(){
  var st = document.getElementById('pst');
  var name = document.getElementById('pname').value.trim();
  var imgs = Array.prototype.slice.call(document.getElementById('pimgs').files, 0, 3);
  var zip = document.getElementById('pfile').files[0];
  if(!name){ st.textContent = 'Nom yozing.'; return; }
  if(!imgs.length){ st.textContent = 'Kamida 1 rasm tanlang.'; return; }
  if(!zip){ st.textContent = 'Zip fayl tanlang.'; return; }
  try{
    st.textContent = 'Yuklanmoqda...';
    var names = imgs.map(function(f){ return f.name; }).concat([zip.name]).join(',');
    var pr = await fetch(API + '/packs/presign?token=' + encodeURIComponent(TOKEN) + '&names=' + encodeURIComponent(names), {method:'POST'});
    if(!pr.ok) throw 0;
    var urls = (await pr.json()).urls;
    var paths = {}, files = {};
    imgs.forEach(function(f){ files[f.name] = f; });
    files[zip.name] = zip;
    var keys = Object.keys(urls);
    for(var i = 0; i < keys.length; i++){
      var k = keys[i];
      st.textContent = 'Yuklanmoqda ' + (i+1) + '/' + keys.length + '...';
      var put = await fetch(urls[k].put, {method:'PUT', body: files[k], headers:{'Content-Type':'application/octet-stream'}});
      if(!put.ok) throw 0;
      paths[k] = urls[k].path;
    }
    var ipaths = imgs.map(function(f){ return paths[f.name]; }).join(',');
    var cr = await fetch(API + '/packs/create?token=' + encodeURIComponent(TOKEN) + '&name=' + encodeURIComponent(name) + '&images=' + encodeURIComponent(ipaths) + '&file=' + encodeURIComponent(paths[zip.name]), {method:'POST'});
    if(!cr.ok) throw 0;
    st.textContent = 'Joylandi!';
    document.getElementById('pname').value = '';
    load();
  }catch(e){ st.textContent = 'Xatolik. Qayta urining.'; }
};

boot();
</script>
</body>
</html>
