<!doctype html>
<html lang="uz" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/icon.png" />
<title>ResursPacklar — UZUM CLIENT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#070a12;--bg2:#0d1220;--card:#121829;--line:#ffffff14;--txt:#eef1f8;--mut:#9aa3b8;--acc:#a855f7;--acc2:#6d28d9;--green:#22c55e;--red:#ef4444}
body{background:radial-gradient(1000px 500px at 20% -5%,#a855f722,transparent),radial-gradient(800px 400px at 90% 10%,#3b82f622,transparent),var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;min-height:100vh}
a{color:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 22px;background:#070a12d9;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.back{text-decoration:none;border:1px solid #ffffff2a;border-radius:12px;padding:9px 16px;font-size:14px;font-weight:600;transition:.2s}
.back:hover{background:#ffffff14}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.logo img{width:30px;height:30px;border-radius:8px}
.hero{max-width:1100px;margin:0 auto;padding:56px 20px 10px;text-align:center}
.hero .pill{display:inline-block;font-size:13px;font-weight:600;color:#d8b4fe;background:#a855f71f;border:1px solid #a855f744;border-radius:100px;padding:6px 16px;margin-bottom:16px}
.hero h1{font-size:clamp(30px,5vw,52px);font-weight:800;letter-spacing:-1px;line-height:1.08}
.hero h1 span{background:linear-gradient(90deg,#c084fc,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin-top:12px;font-size:15px}
.wrap{max-width:1100px;margin:0 auto;padding:30px 20px 100px}
.msg{text-align:center;color:var(--mut);margin:70px 0;font-size:15px}
.msg a{color:#c084fc;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px}
.card{background:linear-gradient(180deg,#141b31,#0f1526);border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:transform .25s,box-shadow .25s;animation:up .5s both}
.card:hover{transform:translateY(-4px);box-shadow:0 20px 50px #00000066}
.card h3{padding:16px 18px 2px;font-size:17px;font-weight:700}
.card .date{padding:0 18px 10px;font-size:12px;color:var(--mut)}
.viewer{position:relative;background:#000;overflow:hidden}
.viewer img.main{width:100%;height:210px;object-fit:cover;display:block;cursor:zoom-in;transition:transform .3s}
.card:hover .viewer img.main{transform:scale(1.03)}
.viewer::after{content:'';position:absolute;inset:auto 0 0 0;height:56px;background:linear-gradient(transparent,#0009);pointer-events:none}
.vbtn{position:absolute;top:50%;transform:translateY(-50%);background:#000000b0;border:1px solid #ffffff2c;color:#fff;font-size:20px;width:38px;height:38px;border-radius:50%;cursor:pointer;z-index:2;transition:.2s}
.vbtn:hover{background:var(--acc)}
.vbtn.l{left:10px}.vbtn.r{right:10px}
.cnt{position:absolute;bottom:10px;right:12px;background:#000000b0;font-size:12px;font-weight:600;padding:3px 10px;border-radius:100px;z-index:2}
.dots{position:absolute;bottom:12px;left:12px;display:flex;gap:5px;z-index:2}
.dots i{width:7px;height:7px;border-radius:50%;background:#ffffff55}
.dots i.on{background:#fff}
.dl{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 16px 16px;background:linear-gradient(90deg,var(--green),#16a34a);color:#04120a;font-weight:800;text-decoration:none;padding:13px;border-radius:12px;transition:.2s}
.dl:hover{filter:brightness(1.1)}
.del{display:block;width:calc(100% - 32px);background:transparent;border:1px solid #ef444455;color:#f87171;padding:9px;border-radius:10px;cursor:pointer;margin:0 16px 16px;font-size:13px;font-weight:600;transition:.2s}
.del:hover{background:#ef444422}
.adm{margin-top:44px;background:linear-gradient(180deg,#151c33,#0f1526);border:1px dashed #a855f766;border-radius:20px;padding:26px}
.adm h2{font-size:18px;margin-bottom:4px}
.adm p.sub{font-size:13px;color:var(--mut);margin-bottom:14px}
.adm input[type=text]{width:100%;background:#070a12;border:1px solid #ffffff22;color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:6px;font-size:15px;font-family:inherit}
.adm input[type=text]:focus{outline:none;border-color:var(--acc)}
.adm label{font-size:13px;color:var(--mut);display:block;margin:12px 0 6px;font-weight:600}
.adm input[type=file]{font-size:13px;color:var(--mut)}
.prev{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.prev img{width:96px;height:72px;object-fit:cover;border-radius:10px;border:1px solid #ffffff22}
.pub{background:linear-gradient(90deg,var(--acc),var(--acc2));border:none;color:#fff;font-weight:800;padding:13px 26px;border-radius:12px;cursor:pointer;margin-top:10px;font-size:15px;transition:.2s}
.pub:hover{filter:brightness(1.12)}
.st{font-size:13px;color:var(--mut);margin-top:10px}
.lb{position:fixed;inset:0;background:#000000f2;display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(6px)}
.lb.open{display:flex;animation:fade .2s}
.lb img{max-width:92vw;max-height:86vh;border-radius:14px;box-shadow:0 30px 80px #000}
.lb .x{position:absolute;top:16px;right:20px;background:#ffffff1c;border:1px solid #ffffff2c;color:#fff;font-size:20px;width:44px;height:44px;border-radius:50%;cursor:pointer}
.lb .nav{width:52px;height:52px;font-size:26px}
.lb .cnt2{position:absolute;bottom:20px;color:#fff;background:#000a;padding:6px 16px;border-radius:100px;font-size:14px}
.hidden{display:none!important}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(max-width:640px){.grid{grid-template-columns:1fr}.hero{padding-top:36px}}
</style>
</head>
<body>
<div class="top">
<a class="back" href="/">← Saytga</a>
<div class="logo"><img src="/icon.png" alt="" />ResursPacklar</div>
</div>
<div class="hero">
<div class="pill">UZUM CLIENT • ResursPacklar</div>
<h1>O'yiningni <span>chiroyli qil</span></h1>
<p>Sifatli resursPacklarni ko'rib chiq, yoqqanini bir klikda yuklab ol.</p>
</div>
<div class="wrap">
<div id="auth" class="msg">Tekshirilmoqda...</div>
<div id="grid" class="grid"></div>
<div id="adm" class="adm hidden">
<h2>Yangi ResursPack qo'shish</h2>
<p class="sub">Faqat admin ko'radi. Rasm (1-3 ta) + zip fayl yukla.</p>
<input id="pname" type="text" maxlength="60" placeholder="Pack nomi (masalan: Purple 16x)" />
<label>Ko'rinish rasmlari (1-3 ta)</label>
<input id="pimgs" type="file" accept="image/*" multiple />
<div id="pprev" class="prev"></div>
<label>Pack fayli (.zip)</label>
<input id="pfile" type="file" accept=".zip" />
<div><button id="ppub" class="pub">Joylash</button></div>
<div id="pst" class="st"></div>
</div>
</div>
<div id="lb" class="lb">
<button class="x" id="lbx">✕</button>
<button class="nav l vbtn" id="lbl">‹</button>
<img id="lbi" src="" alt="" />
<button class="nav r vbtn" id="lbr">›</button>
<div class="cnt2" id="lbc"></div>
</div>
<script>
var API = location.origin + '/api';
function cookie(n){var m=document.cookie.match(new RegExp('(^| )'+n+'=([^;]+)'));return m?decodeURIComponent(m[2]):'';}
var TOKEN = cookie('ajax-cookie');
var ME = null, PACKS = [], LBI = 0, LBIMGS = [];

function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}

async function boot(){
  var box = document.getElementById('auth');
  if(!TOKEN){ box.innerHTML = 'Packlarni ko\'rish uchun <a href="/sign-in">kiring</a>.'; return; }
  try{
    var r = await fetch(API + '/users/auth/session?token=' + encodeURIComponent(TOKEN), {method:'POST'});
    if(!r.ok) throw 0;
    ME = await r.json();
  }catch(e){ box.innerHTML = 'Sessiya tugagan. <a href="/sign-in">Qayta kiring</a>.'; return; }
  box.style.display = 'none';
  if(ME.role === 'ADMIN') document.getElementById('adm').classList.remove('hidden');
  load();
}

async function load(){
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  try{
    var r = await fetch(API + '/packs/list?token=' + encodeURIComponent(TOKEN));
    if(!r.ok) throw 0;
    PACKS = await r.json();
  }catch(e){ grid.innerHTML = '<div class="msg">Yuklanmadi. Qayta urinib ko\'ring.</div>'; return; }
  if(!PACKS.length){ grid.innerHTML = '<div class="msg">Hozircha packlar yo\'q. Tez orada qo\'shiladi!</div>'; return; }
  PACKS.forEach(function(p, pi){
    var card = el('div','card');
    card.style.animationDelay = (pi*0.07)+'s';
    card.appendChild(el('h3','',p.name));
    var v = el('div','viewer');
    var img = el('img','main'); img.src = p.images[0]; img.alt = p.name; img.loading = 'lazy';
    img.onclick = function(){ openLb(p.images, 0); };
    v.appendChild(img);
    if(p.images.length > 1){
      var idx = 0;
      var bl = el('button','vbtn l','‹'), br = el('button','vbtn r','›');
      var dots = el('div','dots');
      for(var di = 0; di < p.images.length; di++) dots.appendChild(el('i', di===0?'on':''));
      var show = function(){
        img.src = p.images[idx];
        var ds = dots.children;
        for(var k = 0; k < ds.length; k++) ds[k].className = k===idx?'on':'';
      };
      bl.onclick = function(ev){ ev.stopPropagation(); idx = (idx+p.images.length-1)%p.images.length; show(); };
      br.onclick = function(ev){ ev.stopPropagation(); idx = (idx+1)%p.images.length; show(); };
      v.appendChild(bl); v.appendChild(br); v.appendChild(dots);
      img.onclick = function(){ openLb(p.images, idx); };
    }
    card.appendChild(v);
    var a = el('a','dl','⬇ Yuklab olish');
    a.href = p.file;
    card.appendChild(a);
    if(ME && ME.role === 'ADMIN'){
      var del = el('button','','O\'chirish');
      del.className = 'del';
      del.onclick = async function(){
        if(!confirm('O\'chirilsinmi: ' + p.name + '?')) return;
        await fetch(API + '/packs/remove?token=' + encodeURIComponent(TOKEN) + '&id=' + p.id, {method:'POST'});
        load();
      };
      card.appendChild(del);
    }
    grid.appendChild(card);
  });
}

var lb = document.getElementById('lb'), lbi = document.getElementById('lbi'), lbc = document.getElementById('lbc');
function openLb(imgs, i){ LBIMGS = imgs; LBI = i; updLb(); lb.classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeLb(){ lb.classList.remove('open'); document.body.style.overflow = ''; }
function updLb(){ lbi.src = LBIMGS[LBI]; lbc.textContent = (LBI+1) + ' / ' + LBIMGS.length; }
function lbGo(d){ if(!LBIMGS.length) return; LBI = (LBI+d+LBIMGS.length)%LBIMGS.length; updLb(); }
document.getElementById('lbx').onclick = closeLb;
document.getElementById('lbl').onclick = function(e){ e.stopPropagation(); lbGo(-1); };
document.getElementById('lbr').onclick = function(e){ e.stopPropagation(); lbGo(1); };
lb.onclick = function(e){ if(e.target === lb) closeLb(); };
document.addEventListener('keydown', function(e){
  if(!lb.classList.contains('open')) return;
  if(e.key === 'Escape') closeLb();
  if(e.key === 'ArrowLeft') lbGo(-1);
  if(e.key === 'ArrowRight') lbGo(1);
});
var tx0 = 0;
lb.addEventListener('touchstart', function(e){ tx0 = e.changedTouches[0].clientX; }, {passive:true});
lb.addEventListener('touchend', function(e){
  var dx = e.changedTouches[0].clientX - tx0;
  if(Math.abs(dx) > 40) lbGo(dx < 0 ? 1 : -1);
}, {passive:true});

document.getElementById('pimgs').addEventListener('change', function(){
  var box = document.getElementById('pprev'); box.innerHTML = '';
  Array.prototype.slice.call(this.files, 0, 3).forEach(function(f){
    var im = document.createElement('img'); im.src = URL.createObjectURL(f); box.appendChild(im);
  });
});
document.getElementById('ppub').onclick = async function(){
  var st = document.getElementById('pst');
  var name = document.getElementById('pname').value.trim();
  var imgs = Array.prototype.slice.call(document.getElementById('pimgs').files, 0, 3);
  var zip = document.getElementById('pfile').files[0];
  if(!name){ st.textContent = 'Nom yozing.'; return; }
  if(!imgs.length){ st.textContent = 'Kamida 1 rasm tanlang.'; return; }
  if(!zip){ st.textContent = 'Zip fayl tanlang.'; return; }
  try{
    st.textContent = 'Tayyorlanmoqda...';
    var names = imgs.map(function(f){ return f.name; }).concat([zip.name]).join(',');
    var pr = await fetch(API + '/packs/presign?token=' + encodeURIComponent(TOKEN) + '&names=' + encodeURIComponent(names), {method:'POST'});
    if(!pr.ok) throw 0;
    var urls = (await pr.json()).urls;
    var paths = {}, files = {};
    imgs.forEach(function(f){ files[f.name] = f; });
    files[zip.name] = zip;
    var keys = Object.keys(urls);
    for(var i = 0; i < keys.length; i++){
      var k = keys[i];
      st.textContent = 'Yuklanmoqda ' + (i+1) + '/' + keys.length + '...';
      var put = await fetch(urls[k].put, {method:'PUT', body: files[k], headers:{'Content-Type':'application/octet-stream'}});
      if(!put.ok) throw 0;
      paths[k] = urls[k].path;
    }
    var ipaths = imgs.map(function(f){ return paths[f.name]; }).join(',');
    var cr = await fetch(API + '/packs/create?token=' + encodeURIComponent(TOKEN) + '&name=' + encodeURIComponent(name) + '&images=' + encodeURIComponent(ipaths) + '&file=' + encodeURIComponent(paths[zip.name]), {method:'POST'});
    if(!cr.ok) throw 0;
    st.textContent = 'Joylandi!';
    document.getElementById('pname').value = '';
    document.getElementById('pimgs').value = '';
    document.getElementById('pfile').value = '';
    document.getElementById('pprev').innerHTML = '';
    load();
  }catch(e){ st.textContent = 'Xatolik. Qayta urining.'; }
};

boot();
</script>
</body>
</html>
